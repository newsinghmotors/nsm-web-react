<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/nsm-web-react/src/assets/NSM logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Singh Motors - Korba</title>
    <script>
      // This script handles 404 errors for client-side routing on GitHub Pages
      // It redirects 404 errors to index.html so React Router can handle the routing
      (function() {
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + '/index.html?redirect=' + l.pathname.slice(1) + l.search + l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
